name: RELEASE-IMAGE

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'The tag name of image'
        required: true
        default: ''
      pg_version:
        description: 'The version of postgres'
        required: true
      skip_test:
        description: 'Skip testing the docker image'
        required: false
        type: boolean
        default: false
      additional_locales:
        description: 'Space-separated extra locales to include (e.g. zh_CN de_DE)'
        required: false
        default: 'zh_CN'

  release:
    types:
      - published

env:
  RELEASE_VERSION: ${{ github.ref_name }}
  IMAGE_NAME: "apecloud/spilo"
  DOCKER_USER: ${{ secrets.DOCKER_REGISTRY_USER }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
  ALIYUN_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

run-name: release image_tag:${{ inputs.image_tag }} pg_version:${{ inputs.pg_version }} locales:${{ inputs.additional_locales }} skip_test:${{ inputs.skip_test }}

jobs:
  image-tag:
    runs-on: ubuntu-22.04
    outputs:
      tag-name: ${{ steps.get_tag_name.outputs.tag_name }}
    steps:
      - name: Get Tag Name
        id: get_tag_name
        run: |
          TAG_NAME=${{ inputs.image_tag }}
          #if [ -z "$TAG_NAME" ]; then
          #    TAG_NAME=${{ env.RELEASE_VERSION }}
          #fi
          #TAG_NAME="${TAG_NAME/v/}"
          echo tag_name=$TAG_NAME >> $GITHUB_OUTPUT

  build-image:
    needs: image-tag
    name: Build and test ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up packages for Spilo integration tests
        if: ${{ !inputs.skip_test && matrix.arch == 'amd64' }}
        run: sudo apt-get update && sudo apt-get install -y shellcheck docker-compose

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and export to local docker for testing
        if: ${{ !inputs.skip_test }}
        uses: docker/build-push-action@v6
        with:
          context: postgres-appliance/
          load: true
          tags: spilo:test
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PGVERSION=${{ inputs.pg_version }}
            PGOLDVERSIONS=
            ADDITIONAL_LOCALES=${{ inputs.additional_locales || 'zh_CN' }}

      - name: Test PostgreSQL extensions
        if: ${{ !inputs.skip_test && contains(fromJSON('["14", "15", "16", "17", "18"]'), inputs.pg_version) }}
        env:
          SPILO_TEST_IMAGE: spilo:test
        run: bash postgres-appliance/tests/test_extensions.sh

      - name: Test spilo docker image
        if: ${{ !inputs.skip_test && matrix.arch == 'amd64' }}
        continue-on-error: true
        env:
          SPILO_TEST_IMAGE: spilo:test
        run: bash postgres-appliance/tests/test_spilo.sh

      - name: Push native image by digest
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: postgres-appliance/
          outputs: type=image,name=docker.io/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PGVERSION=${{ inputs.pg_version }}
            PGOLDVERSIONS=
            ADDITIONAL_LOCALES=${{ inputs.additional_locales || 'zh_CN' }}

      - name: Verify published native image
        if: ${{ !inputs.skip_test }}
        env:
          SPILO_TEST_IMAGE: docker.io/${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}
          ADDITIONAL_LOCALES: ${{ inputs.additional_locales || 'zh_CN' }}
          PG_VERSION: ${{ inputs.pg_version }}
          IMAGE_PLATFORM: linux/${{ matrix.arch }}
        run: |
          docker pull --platform "$IMAGE_PLATFORM" "$SPILO_TEST_IMAGE"
          if [[ " $ADDITIONAL_LOCALES " == *" zh_CN "* ]]; then
            docker run --rm --platform "$IMAGE_PLATFORM" --entrypoint locale "$SPILO_TEST_IMAGE" -a | grep -Fx zh_CN.utf8
          fi
          case "$PG_VERSION" in
            14|15|16|17|18) bash postgres-appliance/tests/test_extensions.sh ;;
          esac

      - name: Export verified digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release-image:
    needs: [image-tag, build-image]
    name: Publish verified multi-platform image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Download verified digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Set up Skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Create and verify multi-platform index
        id: index
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.image-tag.outputs.tag-name }}
        run: |
          cd /tmp/digests
          digests=(*)
          [ "${#digests[@]}" -eq 2 ]
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("docker.io/$IMAGE_NAME@sha256:$digest")
          done
          image="docker.io/$IMAGE_NAME:$IMAGE_TAG"
          docker buildx imagetools create --tag "$image" "${sources[@]}"
          skopeo inspect --raw --creds "$DOCKER_USER:$DOCKER_PASSWORD" "docker://$image" > /tmp/image-index.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' /tmp/image-index.json
          echo "digest=$(skopeo manifest-digest /tmp/image-index.json)" >> "$GITHUB_OUTPUT"

      - name: Copy all image platforms to Aliyun
        env:
          SOURCE_DIGEST: ${{ steps.index.outputs.digest }}
          IMAGE_TAG: ${{ needs.image-tag.outputs.tag-name }}
        run: |
          skopeo copy --all --preserve-digests \
            --src-creds "$DOCKER_USER:$DOCKER_PASSWORD" \
            --dest-creds "$ALIYUN_USER:$ALIYUN_PASSWORD" \
            "docker://docker.io/$IMAGE_NAME@$SOURCE_DIGEST" \
            "docker://apecloud-registry.cn-zhangjiakou.cr.aliyuncs.com/$IMAGE_NAME:$IMAGE_TAG"
